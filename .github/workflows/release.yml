name: Release

# On a v* tag: take the wheels and the sdist of the Wheels run on main for the tagged commit (no
# new build), create the GitHub Release with them, then publish them to PyPI. The PyPI job is
# disabled (`if: false`) until PyPI trusted publishing is configured. See docs/development.md,
# "Release".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      actions: read # find the Wheels run and download its artifacts
      contents: write # create the release
    outputs:
      wheels-run-id: ${{ steps.run.outputs.id }}
    steps:
      - name: Find the Wheels run for the tagged commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow wheels.yml --branch main --event push --commit "$GITHUB_SHA" \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z $id ]]; then
            echo "::error::no Wheels run on main for $GITHUB_SHA: push the commit to main first"
            exit 1
          fi
          echo "Wheels run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          # If the tag is pushed while the run is still going, wait for it.
          gh run watch "$id" --exit-status --interval 30 > /dev/null || {
            echo "::error::Wheels run $id did not pass"
            exit 1
          }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v6
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Check the version
        run: |
          version=${GITHUB_REF_NAME#v}
          ls -l dist
          ls dist/manyfaced-"$version".tar.gz > /dev/null || {
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml"
            exit 1
          }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  pypi:
    name: Publish to PyPI
    needs: github-release
    # Remove this line to publish to PyPI (docs/development.md, "Release").
    if: false
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/manyfaced/
    permissions:
      actions: read # download the artifacts of the Wheels run
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          run-id: ${{ needs.github-release.outputs.wheels-run-id }}
          github-token: ${{ github.token }}
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
