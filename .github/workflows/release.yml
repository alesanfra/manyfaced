name: Release

# Publishes the wheels and the sdist of one Wheels run to PyPI. Disabled (`if: false`): the
# maintainer decides when to publish. Steps: docs/development.md, "Release".
on:
  workflow_dispatch:
    inputs:
      wheels-run-id:
        description: ID of a passing Wheels run for a v* tag (from the URL of the run)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    # Remove this line to enable publishing (docs/development.md, "Release", step 4).
    if: false
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/manyfaced/
    permissions:
      actions: read # download the artifacts of the Wheels run
      id-token: write # PyPI trusted publishing
    steps:
      - name: Check the Wheels run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.wheels-run-id }}
        run: |
          read -r name event ref conclusion < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '[.name, .event, .head_branch, .conclusion] | @tsv')
          echo "run $RUN_ID: $name, $event, $ref, $conclusion"
          [[ $name == Wheels ]] || { echo "not a Wheels run"; exit 1; }
          [[ $event == push && $ref == v* ]] || { echo "not a run for a v* tag"; exit 1; }
          [[ $conclusion == success ]] || { echo "the run did not pass"; exit 1; }
      - uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.wheels-run-id }}
          github-token: ${{ github.token }}
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: List the files
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
